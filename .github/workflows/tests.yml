name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: ozon-dim-demo --output-dir demo_output_ci
      - run: ozon-dim-benchmark --output-dir benchmark_output_ci
      - run: ozon-dim-generate-datasets --output-dir datasets_ci
