[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-conveyor-dimensions"
version = "0.1.0"
description = "Базовая версия алгоритма измерения габаритов товара на конвейере"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
ozon-dim-demo = "ozon_dimension_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

